server:
  port: 8095

spring:
  application:
    name: book-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: orquestacion
  cloud:
    function:
      definition: consumerBook

    stream:
      default:
        contentType: application/json

      bindings:
        consumerBook-in-0:
          destination: orders.buy
          group: books-group
          consumer:
            maxAttempts: 3

      kafka:
        binder:
          brokers: ${KAFKA_BROKERS}
