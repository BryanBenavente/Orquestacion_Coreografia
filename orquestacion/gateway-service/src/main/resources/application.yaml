server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8099/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: book-service
              uri: lb://BOOK-SERVICE
              predicates:
                - Path=/book/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/sales/**